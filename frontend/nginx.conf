events {}
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad (HTTPS lo resuelve Caddy delante).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Proxy hacia backend (temporalmente desactivado)
        # location /api/ {
        #     proxy_pass http://maxan-backend:5000/api/;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }

        # SPA fallback (React + Vite)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html nunca se cachea: es quien apunta a los bundles con hash.
        location = /index.html {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            expires -1;
        }

        # Los assets de Vite llevan hash en el nombre: se cachean un año.
        location /assets/ {
            expires 1y;
        }

        # Imágenes y fuentes: cache largo pero revalidable.
        location ~* ^/(images|fonts)/ {
            expires 30d;
        }

        # robots.txt y sitemap.xml: siempre frescos.
        location = /robots.txt {
            expires -1;
        }

        location = /sitemap.xml {
            expires -1;
        }
    }
}
